# Server Configuration
# SECURITY: Bind only to localhost (127.0.0.1) to prevent external access
server.address=127.0.0.1
server.port=8088
spring.application.name=sdk-local-service

# Security Configuration
sls.security.enabled=true
sls.security.enable-logging=true
sls.security.default-token-expiry-hours=24
sls.security.token-header=X-SLS-Token

# Allowed origins for CORS and origin validation (comma-separated)
sls.security.allowed-origins=https://hmdevonline.com,http://localhost,http://127.0.0.1

# Public endpoints (no token required) - comma-separated
# Note: /terminal/stream WebSocket doesn't need token - sessionId provides access control
# Note: H2 console is NOT public - it has built-in security and should only be enabled for debugging
sls.security.public-endpoints=/health,/auth/token,/auth/status,/auth/validate,/favicon.ico,/,/index.html,/terminal/stream

# Static resource extensions (no token required) - comma-separated
sls.security.static-extensions=.html,.css,.js,.json,.png,.jpg,.jpeg,.gif,.svg,.ico,.woff,.woff2,.ttf,.eot,.map,.txt,.md

# H2 Database (file-based, persisted)
spring.datasource.url=jdbc:h2:file:./sls-data;NON_KEYWORDS=KEY,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (web-based database viewer)
# SECURITY WARNING:
#   - Disabled by default for security
#   - If enabled, H2 console REQUIRES a valid security token
#   - DO NOT add to public endpoints list
#   - Only enable for local debugging
#   - web-allow-others=false prevents remote access
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# SLS Configuration
sls.version=1.0.0

# Logging
logging.level.com.hmdev.sdk.local.security=INFO
logging.level.com.hmdev.sdk.local=DEBUG
logging.file.name=./logs/sls.log
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="js/prod-log.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation — Messaging Platform SDK</title>
    <meta name="description" content="Developer user guide for the Messaging Platform SDK: getting started, channels, messaging, WebRTC, and channel storage.">
    <meta name="theme-color" content="#0b1120">
    <link rel="canonical" href="https://hmdevonline.com/messaging-platform/sdk/docs.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Messaging Platform SDK">
    <meta property="og:title" content="Documentation">
    <meta property="og:description" content="Developer user guide for the Messaging Platform SDK: getting started, channels, messaging, WebRTC, and channel storage.">
    <meta property="og:url" content="https://hmdevonline.com/messaging-platform/sdk/docs.html">
    <meta property="og:image" content="https://hmdevonline.com/messaging-platform/sdk/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Documentation">
    <meta name="twitter:description" content="Developer user guide for the Messaging Platform SDK: getting started, channels, messaging, WebRTC, and channel storage.">
    <meta name="twitter:image" content="https://hmdevonline.com/messaging-platform/sdk/images/og-image.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/design-tokens.css">
    <script src="js/icons.js" defer></script>
    <script src="lib/marked.min.js"></script>
    <style>
        /* Local aliases onto the shared design tokens so the docs shell reads
           as the same product as the landing page and the consoles. */
        :root {
            --panel: var(--surface-1);
            --sidebar-bg: var(--surface-1);
            --muted: var(--text-muted);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header__title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        .btn {
            white-space: nowrap;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(79, 70, 229, 0.2);
            border-color: var(--accent);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar-wrap {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar { flex: 1; overflow-y: auto; }

        /* On a phone the heading list is collapsed behind a summary; on a wide
           screen the disclosure is forced open and its summary is hidden, so
           the sidebar reads exactly as it did before. */
        .nav-disclosure { display: contents; }
        .nav-disclosure > summary { display: none; }

        .doc-switcher {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .doc-tab {
            padding: 8px 12px;
            border-radius: var(--r-md);
            color: var(--text-body);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .doc-tab:hover { background: var(--surface-2); color: var(--text); }
        .doc-tab.active {
            background: var(--brand-subtle);
            color: var(--text);
            font-weight: 600;
            box-shadow: inset 2px 0 0 var(--brand);
        }

        @media (max-width: 860px) {
            .header {
                flex-wrap: wrap;
                gap: 12px;
                padding: 12px 16px;
            }
            .header__title { font-size: 16px; gap: 8px; }
            .header-actions {
                width: 100%;
                gap: 8px;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            .header-actions::-webkit-scrollbar { display: none; }
            .btn { padding: 8px 12px; font-size: 13px; }

            .main-container { flex-direction: column; }
            .sidebar-wrap {
                width: 100%;
                max-height: none;
                border-right: 0;
                border-bottom: 1px solid var(--border);
            }

            /* Document tabs run along one scrollable row instead of stacking. */
            .doc-switcher {
                flex-direction: row;
                gap: 6px;
                padding: 10px 12px;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .doc-switcher::-webkit-scrollbar { display: none; }
            .doc-tab { white-space: nowrap; }
            .doc-tab.active { box-shadow: inset 0 -2px 0 var(--brand); }

            .nav-disclosure { display: block; }
            .nav-disclosure > summary {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                padding: 12px 16px;
                font-size: 13px;
                font-weight: 600;
                color: var(--text-body);
                cursor: pointer;
                list-style: none;
                border-top: 1px solid var(--border);
            }
            .nav-disclosure > summary::-webkit-details-marker { display: none; }
            .nav-disclosure > summary::after {
                content: '\25BE';
                color: var(--text-muted);
                transition: transform .15s ease;
            }
            .nav-disclosure[open] > summary::after { transform: rotate(180deg); }
            .nav-disclosure .sidebar { max-height: 45vh; }

            .content { padding: 24px 20px; }
        }

        .sidebar-section {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .sidebar-link {
            display: block;
            padding: 8px 12px;
            color: var(--muted);
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 4px;
            transition: all 0.2s;
        }

        .sidebar-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .sidebar-link.active {
            background: var(--accent);
            color: white;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 40px 60px;
        }

        /* The global reset zeroes every margin, so the rendered markdown needs
           its own vertical rhythm to be readable. */
        .markdown-body {
            overflow-wrap: anywhere;
            background: transparent !important;
            color: var(--text-body) !important;
            max-width: 46rem;
            font-size: var(--fs-base);
            line-height: var(--lh-body);
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3,
        .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            color: var(--text) !important;
            line-height: var(--lh-tight);
            letter-spacing: -0.015em;
            margin: var(--sp-10) 0 var(--sp-4);
        }
        .markdown-body h1 { font-size: var(--fs-3xl); margin-top: 0; }
        .markdown-body h2 {
            font-size: var(--fs-2xl);
            padding-bottom: var(--sp-3);
            border-bottom: 1px solid var(--border);
        }
        .markdown-body h3 { font-size: var(--fs-xl); }
        .markdown-body h4 { font-size: var(--fs-lg); }

        .markdown-body p,
        .markdown-body ul,
        .markdown-body ol,
        .markdown-body pre,
        .markdown-body table,
        .markdown-body blockquote { margin: 0 0 var(--sp-4); }

        .markdown-body ul, .markdown-body ol { padding-left: var(--sp-6); }
        .markdown-body li { margin-bottom: var(--sp-2); }
        .markdown-body li > ul, .markdown-body li > ol { margin: var(--sp-2) 0 0; }
        .markdown-body hr { border: 0; border-top: 1px solid var(--border); margin: var(--sp-10) 0; }
        .markdown-body strong { color: var(--text); }
        .markdown-body img { border-radius: var(--r-md); }

        .markdown-body code {
            background: rgba(255, 255, 255, 0.06) !important;
            color: var(--accent-ink) !important;
            font-family: var(--font-mono);
            font-size: 0.9em;
            padding: 0.125em 0.35em;
            border-radius: var(--r-sm);
        }

        .markdown-body pre {
            background: var(--code-bg) !important;
            border: 1px solid var(--border-strong) !important;
            border-radius: var(--r-lg);
            padding: var(--sp-4);
            overflow-x: auto;
            line-height: 1.6;
        }
        .markdown-body pre code {
            background: none !important;
            color: #dbe4f3 !important;
            padding: 0;
            font-size: var(--fs-sm);
        }

        /* A wide table scrolls inside this box; without it the table sets the
           page width and the whole document scrolls sideways on a phone. */
        .markdown-body .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 0 var(--sp-4);
        }
        .markdown-body table { border-collapse: collapse; width: 100%; font-size: var(--fs-md); }
        .markdown-body .table-scroll > table { margin-bottom: 0; min-width: 34rem; }
        .markdown-body th, .markdown-body td { white-space: nowrap; }
        .markdown-body th, .markdown-body td {
            padding: var(--sp-2) var(--sp-3);
            border: 1px solid var(--border);
            text-align: left;
        }
        .markdown-body th { background: var(--surface-2); color: var(--text); }

        .markdown-body blockquote {
            padding: var(--sp-3) var(--sp-4);
            border-left: 3px solid var(--brand);
            background: var(--surface-1);
            border-radius: 0 var(--r-md) var(--r-md) 0;
        }

        .markdown-body table {
            border-color: var(--border) !important;
        }

        .markdown-body table tr {
            background: transparent !important;
            border-color: var(--border) !important;
        }

        .markdown-body table tr:nth-child(2n) {
            background: rgba(255, 255, 255, 0.02) !important;
        }

        .markdown-body a {
            color: var(--accent) !important;
        }

        .markdown-body blockquote {
            border-left-color: var(--accent) !important;
            color: var(--muted) !important;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 18px;
            color: var(--muted);
        }

        @media (max-width: 560px) {
            .content { padding: 20px 16px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <p class="header__title">
            <svg width="26" height="26" aria-hidden="true" style="vertical-align:-6px"><use href="#i-logo"></use></svg>
            Messaging Platform SDK — Documentation
        </p>
        <div class="header-actions">
            <a href="index.html" class="btn">Overview</a>
            <a href="playground.html" class="btn">Playground</a>
            <a href="developer/index.html" class="btn">Developer portal</a>
        </div>
    </div>

    <div class="main-container">
        <nav class="sidebar-wrap">
        <div class="doc-switcher" id="docSwitcher" aria-label="Documents"></div>
        <details class="nav-disclosure" id="navDisclosure" open>
            <summary>On this page</summary>
            <div class="sidebar" id="sidebar">
                <!-- Static fallback navigation -->
                <div id="nav-loading" class="loading" style="padding: 16px; font-size: 13px;">Loading navigation...</div>
            </div>
        </details>
        </nav>

        <main class="content">
            <div class="markdown-body" id="content">
                <!-- Static fallback content - shown if JavaScript fails to load documentation -->
                <noscript>
                    <div style="padding: 40px;">
                        <h1>Messaging Platform SDK — user guide</h1>
                        <p style="margin-top: 16px; color: var(--muted);">JavaScript is required to render the full documentation.</p>
                        <p style="margin-top: 16px; color: var(--muted);">Alternatively, view the documentation directly:</p>
                        <ul style="margin-top: 16px; color: var(--muted);">
                            <li><a href="USER-GUIDE.md" style="color: var(--accent);">Read the guide as plain Markdown</a></li>
                            <li><a href="index.html" style="color: var(--accent);">Return to the overview</a></li>
                        </ul>
                    </div>
                </noscript>

                <!-- Loading state - replaced by actual content via JS -->
                <div id="loading-state" class="loading">
                    <div style="text-align: center;">
                        <div>Loading the guide…</div>
                        <div style="margin-top: 12px; font-size: 13px; color: var(--muted);">If this persists, <a href="USER-GUIDE.md" style="color: var(--accent);">view raw markdown</a></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Every document the docs shell can render. Cross-links between them
        // used to 404 because only USER-GUIDE.md was ever served.
        // Product documentation only. The repo, build and contributing guides
        // used to be served here too, which put `./gradlew bootRun`, a git
        // clone and an internal port on the public site — the one thing this
        // site is not allowed to show. They are repository documents; they
        // belong with the repository.
        const DOCS = [
            { file: 'USER-GUIDE.md',      title: 'User guide' },
            { file: 'WEB-AGENT-GUIDE.md', title: 'Web / JavaScript' }
        ];

        function currentDocFile() {
            const requested = new URLSearchParams(location.search).get('doc');
            const match = DOCS.find(d => d.file.toLowerCase() === String(requested || '').toLowerCase());
            return match ? match.file : DOCS[0].file;
        }

        /**
         * Each guide is its own document, so each gets its own canonical.
         *
         * The sitemap lists the ?doc= URLs while the markup declared a static
         * canonical to bare docs.html, which told a crawler that the guide it
         * had just been pointed at was not the canonical version of itself.
         */
        function setCanonical(file) {
            const link = document.querySelector('link[rel="canonical"]');
            if (!link) return;
            const base = link.href.split('?')[0];
            link.href = file === DOCS[0].file ? base : base + '?doc=' + encodeURIComponent(file);
        }

        function renderDocSwitcher(activeFile) {
            const host = document.getElementById('docSwitcher');
            if (!host) return;
            host.innerHTML = '';
            DOCS.forEach(doc => {
                const a = document.createElement('a');
                a.className = 'doc-tab' + (doc.file === activeFile ? ' active' : '');
                a.href = '?doc=' + encodeURIComponent(doc.file);
                a.textContent = doc.title;
                host.appendChild(a);
            });
        }

        /**
         * Markdown links point at sibling .md files. Keep them inside the docs
         * shell instead of dumping the reader onto raw markdown, and drop links
         * to documents this site does not serve.
         */
        function rewriteDocLinks() {
            const known = DOCS.map(d => d.file.toLowerCase());
            document.querySelectorAll('.markdown-body a[href]').forEach(a => {
                const href = a.getAttribute('href');
                if (!href || /^(https?:|mailto:|#)/i.test(href)) return;

                const [path, hash] = href.split('#');
                if (!/\.md$/i.test(path)) return;

                const file = path.split('/').pop();
                const index = known.indexOf(file.toLowerCase());
                if (index === -1) {
                    // Not published here — degrade to plain text rather than a 404.
                    const span = document.createElement('span');
                    span.textContent = a.textContent;
                    span.title = file + ' is not published on this site';
                    span.style.color = 'var(--text-muted)';
                    a.replaceWith(span);
                    return;
                }
                a.setAttribute('href', '?doc=' + encodeURIComponent(DOCS[index].file) + (hash ? '#' + hash : ''));
            });
        }

        async function loadDocumentation() {
            const file = currentDocFile();
            renderDocSwitcher(file);
            setCanonical(file);
            try {
                const response = await fetch('./' + file);
                if (!response.ok) {
                    throw new Error('Failed to load documentation');
                }

                const markdown = await response.text();

                // Parse and render markdown
                const html = marked.parse(markdown);
                document.getElementById('content').innerHTML = html;

                document.title = (DOCS.find(d => d.file === file) || {}).title + ' — Messaging Platform SDK docs';

                rewriteDocLinks();
                wrapTables();

                // Generate navigation from headings
                generateNavigation();

                // Setup smooth scrolling
                setupSmoothScrolling();

            } catch (error) {
                console.error('Error loading documentation:', error);
                const file = currentDocFile();
                const box = document.getElementById('content');
                box.replaceChildren();

                const wrap = document.createElement('div');
                wrap.style.cssText = 'padding: 40px; max-width: 640px; margin: 0 auto';

                const h = document.createElement('h2');
                h.textContent = 'This guide would not load';
                wrap.appendChild(h);

                const why = document.createElement('p');
                why.style.cssText = 'color: var(--muted); margin-top: 16px';
                why.textContent = 'The page asked for ' + file + ' and did not get it. '
                    + 'That is usually a connection that dropped mid-request.';
                wrap.appendChild(why);

                const actions = document.createElement('p');
                actions.style.cssText = 'color: var(--muted); margin-top: 24px';
                const again = document.createElement('a');
                again.href = location.href;
                again.style.color = 'var(--accent)';
                again.textContent = 'Try again';
                const back = document.createElement('a');
                back.href = 'index.html';
                back.style.color = 'var(--accent)';
                back.textContent = 'Back to the overview';
                actions.append(again, document.createTextNode('\u00a0\u00a0·\u00a0\u00a0'), back);
                wrap.appendChild(actions);

                box.appendChild(wrap);
            }
        }

        /**
         * Marked renders bare <table> elements. A wide one would otherwise set
         * the page width and scroll the whole document sideways on a phone.
         */
        function wrapTables() {
            document.querySelectorAll('.markdown-body table').forEach(table => {
                if (table.parentElement && table.parentElement.classList.contains('table-scroll')) return;
                const box = document.createElement('div');
                box.className = 'table-scroll';
                table.replaceWith(box);
                box.appendChild(table);
            });
        }

        function generateNavigation() {
            const content = document.getElementById('content');
            const headings = content.querySelectorAll('h1, h2, h3');

            if (headings.length === 0) return;

            // Group headings by sections
            const sections = new Map();
            let currentH1 = null;

            headings.forEach((heading, index) => {
                // Add ID for anchor links
                const id = `section-${index}`;
                heading.id = id;

                if (heading.tagName === 'H1') {
                    currentH1 = { title: heading.textContent, id, children: [] };
                    sections.set(currentH1, currentH1.children);
                } else if (heading.tagName === 'H2' && currentH1) {
                    currentH1.children.push({ title: heading.textContent, id, level: 2 });
                }
            });

            // Build navigation HTML
            let navHtml = '';
            sections.forEach((children, section) => {
                navHtml += `
                    <div class="sidebar-section">
                        <a href="#${section.id}" class="sidebar-link" data-section="${section.id}">
                            ${section.title}
                        </a>
                        ${children.map(child => `
                            <a href="#${child.id}" class="sidebar-link" data-section="${child.id}" style="padding-left: 24px; font-size: 13px;">
                                ${child.title}
                            </a>
                        `).join('')}
                    </div>
                `;
            });

            document.getElementById('sidebar').innerHTML = navHtml;
        }

        /**
         * The disclosure is only a disclosure on narrow screens; wide screens
         * hide the summary, so it has to be forced open there or the sidebar
         * would vanish for anyone who collapsed it on a phone and rotated.
         */
        function syncNavDisclosure() {
            const nav = document.getElementById('navDisclosure');
            if (!nav) return;
            const narrow = window.matchMedia('(max-width: 860px)');
            const apply = () => { nav.open = !narrow.matches; };
            apply();
            narrow.addEventListener('change', apply);
        }

        function setupSmoothScrolling() {
            const links = document.querySelectorAll('.sidebar-link');

            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetId = link.getAttribute('href').substring(1);
                    const target = document.getElementById(targetId);

                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });

                        // Update active link
                        links.forEach(l => l.classList.remove('active'));
                        link.classList.add('active');
                    }
                });
            });

            // Highlight current section on scroll
            const content = document.querySelector('.content');
            content.addEventListener('scroll', () => {
                const headings = document.querySelectorAll('.markdown-body h1, .markdown-body h2');
                let current = null;

                headings.forEach(heading => {
                    const rect = heading.getBoundingClientRect();
                    if (rect.top < 100) {
                        current = heading.id;
                    }
                });

                if (current) {
                    links.forEach(l => l.classList.remove('active'));
                    const activeLink = document.querySelector(`[data-section="${current}"]`);
                    if (activeLink) {
                        activeLink.classList.add('active');
                    }
                }
            });
        }

        // Load documentation on page load
        syncNavDisclosure();
        loadDocumentation();
    </script>
</body>
</html>

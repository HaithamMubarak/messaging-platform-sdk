<!DOCTYPE html>
<html lang="en" data-theme="admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin sign-in — Messaging Platform</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <link rel="stylesheet" href="../css/design-tokens.css">
    <link rel="stylesheet" href="../css/ui.css">
    <link rel="stylesheet" href="css/admin.css">

    <script>
        if (sessionStorage.getItem('admin_token')) {
            window.location.replace('dashboard.html');
        }
    </script>
    <script src="../js/prod-log.js" defer></script>
    <script src="../js/icons.js" defer></script>
    <script src="../js/ui.js" defer></script>
    <script src="../js/api-config.js" defer></script>
    <script src="js/admin.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>
<div class="privilege-rail" aria-hidden="true"></div>

<main class="auth">
    <div class="auth__card">
        <div class="auth__brand">
            <svg class="logo-mark" aria-hidden="true"><use href="#i-logo"></use></svg>
            Messaging Platform
            <span class="admin-chip">ADMIN</span>
        </div>

        <h1>Administrator sign-in</h1>
        <p>This console manages every developer account on the platform.</p>

        <p style="margin-bottom: var(--sp-5)">
            <span class="env-badge" id="envBadge"><span class="dot"></span><span id="envBadgeText">—</span></span>
        </p>

        <form id="loginForm" novalidate>
            <div class="field">
                <label class="field__label" for="email">Email address</label>
                <input class="field__input" type="email" id="email" autocomplete="email"
                       placeholder="admin@example.com" aria-describedby="emailError" required>
                <p class="field__error" id="emailError"></p>
            </div>

            <div class="field field--password">
                <label class="field__label" for="password">Password</label>
                <input class="field__input" type="password" id="password"
                       autocomplete="current-password" aria-describedby="passwordError" required>
                <button type="button" class="reveal" id="revealPassword" aria-label="Show password" aria-controls="password">
                    <svg class="icon icon--sm" aria-hidden="true"><use href="#i-eye"></use></svg>
                </button>
                <p class="field__error" id="passwordError"></p>
            </div>

            <div class="alert alert--danger" id="loginError" role="alert" hidden>
                <svg class="icon" aria-hidden="true"><use href="#i-alert-circle"></use></svg>
                <p id="loginErrorText"></p>
            </div>

            <button type="submit" class="btn btn--primary btn--block" id="loginBtn">Sign in</button>
        </form>

        <a class="auth__back" href="../index.html">Back to the site</a>
    </div>
</main>
</body>
</html>

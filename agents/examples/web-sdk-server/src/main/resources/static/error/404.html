    <meta name="theme-color" content="#0b1120">
    <!--
      Self-contained on purpose. An error page is rendered for a request at any
      depth and under any mount prefix (this app is served from
      /messaging-platform/sdk/), so external stylesheets and root-absolute
      links both break. Styles are inline and the links are resolved at runtime.
    -->
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            display: grid; place-items: center; padding: 24px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0b1120; color: #c4cede; text-align: center;
        }
        .card { max-width: 34rem; }
        .mark {
            width: 44px; height: 44px; margin: 0 auto 28px;
            border-radius: 12px; background: linear-gradient(120deg, #6366f1, #22d3ee);
            display: grid; place-items: center;
        }
        .mark svg { width: 26px; height: 26px; }
        .eyebrow {
            font-size: .8125rem; font-weight: 700; letter-spacing: .08em;
            text-transform: uppercase; color: #a5b4fc; margin: 0 0 12px;
        }
        h1 { margin: 0 0 16px; font-size: clamp(1.75rem, 4vw, 2.25rem); color: #eef2f8; line-height: 1.15; }
        p.lede { margin: 0 0 32px; line-height: 1.65; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a.btn {
            display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px;
            border-radius: 8px; font-size: 1rem; font-weight: 600; text-decoration: none;
            border: 1px solid rgba(148,163,184,.28); color: #c4cede;
        }
        a.btn:hover { background: #16203a; color: #eef2f8; }
        a.btn.primary {
            background: linear-gradient(120deg, #6366f1, #22d3ee);
            border-color: transparent; color: #fff;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 9.5A2.5 2.5 0 0 1 8.5 7h7A2.5 2.5 0 0 1 18 9.5v3a2.5 2.5 0 0 1-2.5 2.5H11l-3.2 2.4A.5.5 0 0 1 7 17V15h-.5A.5.5 0 0 1 6 14.5z" fill="#fff"/>
            <circle cx="9.6" cy="11" r="1" fill="#4338ca"/><circle cx="12" cy="11" r="1" fill="#4338ca"/><circle cx="14.4" cy="11" r="1" fill="#4338ca"/>
        </svg>
    </div>
    <p class="eyebrow">404</p>
    <h1>We couldn't find that page</h1>
    <p class="lede">
        The link may be out of date. A few pages moved recently — the mini-games now live in the
        playground, and the old developer console is part of the developer portal.
    </p>
    <div class="actions">
        <a class="btn primary" data-to="index.html">Back to the overview</a>
        <a class="btn" data-to="playground.html">Playground</a>
        <a class="btn" data-to="docs.html">Docs</a>
    </div>
</div>
<script>
    // Resolve links against the app root, wherever the app happens to be
    // mounted. Mirrors the prefix detection in js/config-loader.js.
    (function () {
        var path = window.location.pathname || '/';
        var marker = '/messaging-platform/sdk/';
        var i = path.indexOf(marker);
        var base = i !== -1 ? path.slice(0, i + marker.length) : '/';
        document.querySelectorAll('[data-to]').forEach(function (a) {
            a.setAttribute('href', base + a.getAttribute('data-to'));
        });
    })();
</script>
</body>
</html>

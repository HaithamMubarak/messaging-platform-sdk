<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong — Messaging Platform SDK</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/design-tokens.css">
    <link rel="stylesheet" href="/css/ui.css">
    <link rel="stylesheet" href="/css/landing.css">
    <script src="/js/icons.js" defer></script>
</head>
<body>
<main class="wrap" style="min-height:100vh;display:grid;place-items:center;text-align:center">
    <div style="max-width:34rem">
        <a class="brand" href="/" style="justify-content:center;margin-bottom:var(--sp-8)">
            <svg class="logo-mark" aria-hidden="true"><use href="#i-logo"></use></svg>
            Messaging Platform SDK
        </a>
        <p class="eyebrow">Error</p>
        <h1 style="font-size:var(--fs-3xl);margin-bottom:var(--sp-4)">Something went wrong on our end</h1>
        <p style="color:var(--text-body);margin-bottom:var(--sp-8)">
            The request failed before the page could be rendered. The platform is in beta, so this does
            happen — retrying usually works, and the live demos are unaffected.
        </p>
        <div style="display:flex;gap:var(--sp-3);justify-content:center;flex-wrap:wrap">
            <button class="btn btn--lg btn--gradient" type="button" onclick="location.reload()">Try again</button>
            <a class="btn btn--lg btn--ghost" href="/">Back to the overview</a>
            <a class="btn btn--lg btn--ghost" href="/playground.html">Playground</a>
        </div>
    </div>
</main>
</body>
</html>

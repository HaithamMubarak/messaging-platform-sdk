<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../js/prod-log.js"></script>
    <link rel="icon" type="image/svg+xml" href="../../../favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Fall Guys - Multiplayer Obstacle Race</title>

    <!-- Common Styles -->
    <link rel="stylesheet" href="../../../css/toast.css">
    <link rel="stylesheet" href="../../../css/connection-modal.css">
    <link rel="stylesheet" href="../../../css/share-modal.css">

    <!-- Game Styles -->
    <link rel="stylesheet" href="fall-guys.css">

    <!-- Three.js -->
    <script src="../shared/libs/three.min.js"></script>

    <!-- Cannon.js Physics Engine (global CANNON variable) -->
    <script src="../shared/libs/cannon.min.js"></script>
</head>
<body>
    <!-- Share Button (hidden until connected) -->
    <button id="shareBtn" class="share-btn" onclick="fallGuysGame?.openShareModal()" style="display: none;">
        📤 Share
    </button>

    <!-- Connection Status -->
    <div id="connectionStatus" class="connection-status">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Disconnected</span>
    </div>

    <!-- Game Container -->
    <div id="gameContainer" class="game-container">
        <!-- Three.js Canvas will be inserted here -->

        <!-- Game UI Overlay -->
        <div id="gameUI" class="game-ui">
            <!-- Race Position -->
            <div id="racePosition" class="race-position hidden">
                <span id="positionNumber">1st</span>
                <span class="position-label">Place</span>
            </div>

            <!-- Timer -->
            <div id="timerDisplay" class="timer-display hidden">
                <span id="timerValue">0:00</span>
            </div>

            <!-- Player Count -->
            <div id="playerCount" class="player-count">
                <span id="playerCountValue">0</span> Players
            </div>
        </div>

        <!-- Waiting Room Overlay (hidden until connected) -->
        <div id="waitingRoom" class="waiting-room hidden">
            <div class="waiting-content">
                <h1>🏃 Mini Fall Guys</h1>
                <p class="subtitle">Multiplayer Obstacle Race</p>

                <div class="player-list-container">
                    <h3>Players in Lobby</h3>
                    <div id="playerList" class="player-list">
                        <!-- Players will be added here -->
                    </div>
                </div>

                <div class="map-picker-container">
                    <h3>Course</h3>
                    <div id="mapPicker" class="map-picker" role="group" aria-label="Course selection">
                        <button type="button" class="map-option selected" data-map="obstacleRush"
                                aria-pressed="true" onclick="fallGuysGame?.hostSelectMap('obstacleRush')">
                            <span class="map-option__name">Obstacle Rush</span>
                            <span class="map-option__desc">Spinning hammers, gaps and pushers. The classic run.</span>
                            <span class="map-option__tags"><span class="map-tag">Standard</span><span class="map-tag">Long</span></span>
                        </button>
                        <button type="button" class="map-option" data-map="slimeClimb"
                                aria-pressed="false" onclick="fallGuysGame?.hostSelectMap('slimeClimb')">
                            <span class="map-option__name">Slime Climb</span>
                            <span class="map-option__desc">Climb the terraces. Split beams near the top — pick a lane.</span>
                            <span class="map-option__tags"><span class="map-tag">Tricky</span><span class="map-tag">Long</span></span>
                        </button>
                        <button type="button" class="map-option" data-map="hammerAlley"
                                aria-pressed="false" onclick="fallGuysGame?.hostSelectMap('hammerAlley')">
                            <span class="map-option__name">Hammer Alley</span>
                            <span class="map-option__desc">One narrow corridor, eight moving parts. Short and mean.</span>
                            <span class="map-option__tags"><span class="map-tag">Brutal</span><span class="map-tag">Short</span></span>
                        </button>
                    </div>
                    <p id="mapPickerNote" class="map-picker-note">The host picks the course.</p>
                </div>

                <div class="waiting-actions">
                    <button id="startBtn" class="btn-start host-only" onclick="fallGuysGame?.hostStartGame()">
                        Start Race!
                    </button>
                </div>

                <div class="controls-info">
                    <h3>🎮 Controls</h3>
                    <div class="controls-grid">
                        <div class="control-item"><span class="key">W</span> or <span class="key">↑</span> Forward</div>
                        <div class="control-item"><span class="key">S</span> or <span class="key">↓</span> Backward</div>
                        <div class="control-item"><span class="key">A</span> or <span class="key">←</span> Left</div>
                        <div class="control-item"><span class="key">D</span> or <span class="key">→</span> Right</div>
                        <div class="control-item"><span class="key">SPACE</span> Jump</div>
                        <div class="control-item"><span class="key">SHIFT</span> Kick players!</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Finish Overlay -->
        <div id="finishOverlay" class="finish-overlay hidden">
            <div class="finish-content">
                <h1 id="finishTitle">🏆 Race Complete!</h1>
                <div id="finishResults" class="finish-results">
                    <!-- Results will be added here -->
                </div>
                <button id="playAgainBtn" class="btn-play-again host-only" onclick="fallGuysGame?.hostRestartGame()">
                    Play Again
                </button>
            </div>
        </div>

        <!-- Controls Guide (Mobile) -->
        <div id="mobileControls" class="mobile-controls hidden">
            <div class="joystick-area" id="joystickArea">
                <div class="joystick-base">
                    <div class="joystick-stick" id="joystickStick"></div>
                </div>
            </div>
            <div class="action-buttons">
                <button id="jumpBtn" class="action-btn jump-btn">JUMP</button>
                <button id="kickBtn" class="action-btn kick-btn">KICK</button>
            </div>
        </div>
    </div>

    <!-- Share Modal Container -->
    <div id="shareModalContainer"></div>

    <!-- Scripts -->
    <script src="../../../js/config-loader.js"></script>
    <script src="../../../lib/qrcode.min.js"></script>
    <script src="../../../generated-web-agent-js/js/web-agent.libs.js"></script>
    <script src="../../../generated-web-agent-js/js/web-agent.js"></script>
    <script src="../../../generated-web-agent-js/js/web-agent.webrtc.js"></script>

    <script src="../../../js/share-modal.js"></script>
    <script src="../../../js/common-utils.js"></script>
    <script src="../../../js/connection-modal.js"></script>
    <script src="../../../js/UserConnectionBase.js"></script>

    <script src="map-data.js"></script>
    <script src="fall-guys.js"></script>
</body>
</html>

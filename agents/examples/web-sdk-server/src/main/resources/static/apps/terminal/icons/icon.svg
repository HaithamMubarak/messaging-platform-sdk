<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#1a1a2e"/>

  <!-- Terminal Window -->
  <rect x="80" y="120" width="352" height="272" rx="12" fill="#0a0a14" stroke="#4a9eff" stroke-width="4"/>

  <!-- Terminal Header Dots -->
  <circle cx="110" cy="150" r="8" fill="#f87171"/>
  <circle cx="140" cy="150" r="8" fill="#fbbf24"/>
  <circle cx="170" cy="150" r="8" fill="#4ade80"/>

  <!-- Terminal Prompt Symbol ">" -->
  <text x="115" y="260" font-family="monospace" font-size="120" font-weight="bold" fill="#4a9eff">&gt;</text>

  <!-- Terminal Cursor -->
  <rect x="220" y="200" width="20" height="80" fill="#4a9eff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Cloud Share Icon (small) -->
  <g transform="translate(360, 320)">
    <path d="M 0,-12 Q -8,-12 -12,-8 Q -16,-4 -16,0 Q -16,4 -12,8 L 12,8 Q 16,4 16,0 Q 16,-4 12,-8 Q 8,-12 0,-12 Z"
          fill="#22d3ee" opacity="0.7"/>
    <circle cx="0" cy="-8" r="6" fill="#22d3ee" opacity="0.7"/>
  </g>
</svg>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../js/prod-log.js"></script>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud connection component — the connect panel, on the Messaging Platform SDK</title>
    <meta name="description" content="The connection panel on its own: how an app asks for a channel, a name and a password, and what it does with the answer.">
    <meta name="theme-color" content="#0b1120">
    <link rel="canonical" href="https://hmdevonline.com/messaging-platform/sdk/apps/cloud-connection-demo.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Messaging Platform SDK">
    <meta property="og:title" content="Cloud connection component">
    <meta property="og:description" content="The connection panel on its own: how an app asks for a channel, a name and a password, and what it does with the answer.">
    <meta property="og:url" content="https://hmdevonline.com/messaging-platform/sdk/apps/cloud-connection-demo.html">
    <meta property="og:image" content="https://hmdevonline.com/messaging-platform/sdk/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Cloud connection component">
    <meta name="twitter:description" content="The connection panel on its own: how an app asks for a channel, a name and a password, and what it does with the answer.">
    <meta name="twitter:image" content="https://hmdevonline.com/messaging-platform/sdk/images/og-image.png">

    <!-- Required CSS -->
    <link rel="stylesheet" href="../css/cloud-connection.css">

    <style>
        /* Define CSS variables for the component */
        :root {
            --bg-sidebar: #12121f;
            --bg-panel: #0f0f1a;
            --bg-tab: #1e1e3a;
            --border-color: #2a2a4a;
            --text-primary: #e0e0e0;
            --text-secondary: #8888aa;
            --text-muted: #555577;
            --accent-blue: #4a9eff;
            --accent-purple: #a78bfa;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-orange: #fb923c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #071225 0%, #071b2b 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            text-align: center;
        }

        .demo-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .demo-btn {
            padding: 10px 20px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }

        .demo-btn:hover {
            filter: brightness(1.1);
        }

        #messageLog {
            background: #000;
            color: #0f0;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
    </style>
    <link rel="stylesheet" href="../css/app-chrome.css">
</head>
<body>
    <div class="container">
        <h1>☁️ Cloud Connection Component Demo</h1>

        <!-- Cloud Connection Panel -->
        <div class="cloud-panel expanded" id="cloudPanel">
            <div class="cloud-panel-header" onclick="toggleCloudPanel()">
                <div class="cloud-panel-title">
                    <span>☁️</span>
                    <span>Messaging Platform Cloud</span>
                </div>
                <div class="cloud-panel-status">
                    <div class="status-dot" id="cloudStatus"></div>
                    <span id="cloudStatusText">Disconnected</span>
                </div>
            </div>
            <div class="cloud-panel-body">
                <div class="cloud-form-row">
                    <label>Channel Name</label>
                    <input type="text" id="cloudChannelName" placeholder="my-channel" value="test-channel">
                </div>
                <div class="cloud-form-row">
                    <label>Channel Password</label>
                    <input type="password" id="cloudChannelPassword" placeholder="Channel password" value="test123">
                </div>
                <div class="cloud-form-row">
                    <label>Your Agent Name</label>
                    <div class="cloud-input-group">
                        <input type="text" id="cloudAgentName" placeholder="Auto-generated if empty">
                        <button type="button" class="cloud-regen-btn" onclick="regenerateAgentName()" title="Generate random agent name">
                            🔄
                        </button>
                    </div>
                </div>
                <button type="button" class="cloud-btn" id="cloudConnectBtn" onclick="connectToCloud()">
                    Connect to Cloud
                </button>

                <div class="cloud-agents" id="cloudAgentsSection" style="display: none;">
                    <div class="cloud-agents-title">Connected Agents</div>
                    <div id="cloudAgentsList">
                        <!-- Agents will be populated here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Demo Controls -->
        <div class="demo-section">
            <h3 style="margin-bottom: 10px;">Demo Controls</h3>
            <button class="demo-btn" onclick="sendTestMessage()">Send Test Message</button>
            <button class="demo-btn" onclick="clearLog()">Clear Log</button>

            <div id="messageLog"></div>
        </div>
    </div>

    <!-- Required Scripts -->
    <script src="../js/config-loader.js"></script>
    <script src="../generated-web-agent-js/js/web-agent.libs.js"></script>
    <script src="../generated-web-agent-js/js/web-agent.js"></script>
    <script src="../js/UserConnectionBase.js"></script>
    <script src="terminal/terminal-sharing.js"></script>  <!-- TerminalSharing (single class) -->
    <script src="../js/cloud-connection.js"></script>     <!-- CloudConnectionUI -->

    <script>
        // Cloud interaction instance (data logic - like air-hockey game)
        let cloudInteraction = null;
        let cloudConnected = false;
        let cloudAgentName = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('messageLog');
            const timestamp = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.textContent = `[${timestamp}] ${message}`;
            if (type === 'error') line.style.color = '#f00';
            if (type === 'success') line.style.color = '#0f0';
            if (type === 'warning') line.style.color = '#ff0';
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('messageLog').innerHTML = '';
        }

        function toggleCloudPanel() {
            CloudConnectionUI.togglePanel();
        }

        function regenerateAgentName() {
            const name = CloudConnectionUI.generateAgentName();
            CloudConnectionUI.setAgentName(name);
            log(`Generated agent name: ${name}`);
        }

        async function connectToCloud() {
            const config = CloudConnectionUI.getConnectionConfig();

            if (!config.channelName || !config.channelPassword) {
                log('Please enter channel name and password', 'error');
                return;
            }

            // Auto-generate agent name if empty
            if (!config.agentName) {
                config.agentName = CloudConnectionUI.generateAgentName();
                CloudConnectionUI.setAgentName(config.agentName);
            }

            CloudConnectionUI.showConnecting();

            try {
                // Create TerminalSharing instance (data layer - single class)
                cloudInteraction = new TerminalSharing();

                // Set up message handler
                cloudInteraction.onMessageReceived = (message, sourceAgent) => {
                    log(`Message from ${sourceAgent}: ${JSON.stringify(message)}`, 'info');
                };

                // Connect
                await cloudInteraction.connect({
                    username: config.agentName,
                    channelName: config.channelName,
                    channelPassword: config.channelPassword
                });

                // Connection successful
                cloudConnected = true;
                cloudAgentName = config.agentName;

                CloudConnectionUI.showConnected(config.agentName);
                log(`Connected as ${config.agentName}`, 'success');

                // Start polling agents for UI updates
                pollAgents();

            } catch (error) {
                log(`Connection failed: ${error.message}`, 'error');
                CloudConnectionUI.showDisconnected();
                cloudInteraction = null;
                cloudConnected = false;
            }
        }

        function pollAgents() {
            if (!cloudConnected || !cloudInteraction) return;
            const agents = cloudInteraction.getAgents();
            CloudConnectionUI.updateAgentsList(agents, cloudAgentName);
            setTimeout(pollAgents, 2000);
        }

        function disconnectFromCloud() {
            if (cloudInteraction) {
                cloudInteraction.disconnect();
            }
            cloudInteraction = null;
            cloudConnected = false;
            cloudAgentName = null;

            CloudConnectionUI.showDisconnected();
            log('Disconnected from cloud', 'warning');
        }

        function sendTestMessage() {
            if (!cloudConnected || !cloudInteraction) {
                log('Not connected to cloud', 'error');
                return;
            }

            const message = {
                type: 'test',
                text: 'Hello from cloud connection component!',
                timestamp: Date.now()
            };

            cloudInteraction.sendData(message);
            log(`Sent test message: ${message.text}`, 'success');
        }

        // Initialize UI
        window.addEventListener('load', () => {
            CloudConnectionUI.init({
                panelId: 'cloudPanel',
                statusDotId: 'cloudStatus',
                statusTextId: 'cloudStatusText',
                agentListId: 'cloudAgentsList',
                connectBtnId: 'cloudConnectBtn',
                channelNameId: 'cloudChannelName',
                channelPasswordId: 'cloudChannelPassword',
                agentNameId: 'cloudAgentName',
                onConnect: connectToCloud,
                onDisconnect: disconnectFromCloud
            });

            log('Cloud Connection Component loaded', 'success');
            log('Fill in the form and click "Connect to Cloud"', 'info');
        });

        // Note: Page unload cleanup is handled automatically by web-agent.js
        // The cloud connection will be disconnected automatically when page closes
        // No need for manual beforeunload handler here!
    </script>
<script src="../js/room-defaults.js"></script>
<script>RoomDefaults.apply({ prefix: 'clouddemo_', channelPrefix: 'demo-', channelId: 'cloudChannelName', passwordId: 'cloudChannelPassword', sharedDefaults: ['test-channel', 'test123'] });</script>
<script src="../js/app-chrome.js"></script>
</body>
</html>

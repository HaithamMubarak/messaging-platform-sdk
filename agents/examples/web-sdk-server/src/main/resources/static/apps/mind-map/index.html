<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../js/prod-log.js"></script>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
    <meta name="theme-color" content="#0891b2">
    <link rel="canonical" href="https://hmdevonline.com/messaging-platform/sdk/apps/mind-map/index.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Messaging Platform SDK">
    <meta property="og:title" content="Mind map">
    <meta property="og:description" content="Build a map of nodes and connections with other people in real time. Everything you drag lands on their screen as you drag it.">
    <meta property="og:url" content="https://hmdevonline.com/messaging-platform/sdk/apps/mind-map/index.html">
    <meta property="og:image" content="https://hmdevonline.com/messaging-platform/sdk/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mind map">
    <meta name="twitter:description" content="Build a map of nodes and connections with other people in real time. Everything you drag lands on their screen as you drag it.">
    <meta name="twitter:image" content="https://hmdevonline.com/messaging-platform/sdk/images/og-image.png">
    <title>Mind map — build one together on the Messaging Platform SDK</title>
    <meta name="description" content="Build a map of nodes and connections with other people in real time. Everything you drag lands on their screen as you drag it.">

    <!-- Common Styles -->
    <link rel="stylesheet" href="../../css/toast.css">
    <link rel="stylesheet" href="../../css/connection-modal.css">
    <link rel="stylesheet" href="../../css/share-modal.css">

    <!-- App Styles -->
    <link rel="stylesheet" href="../../css/design-tokens.css">
    <link rel="stylesheet" href="../../css/ui.css">
    <link rel="stylesheet" href="mind-map.css">
    <link rel="stylesheet" href="../../css/app-chrome.css">
</head>
<body>
    <!-- Share Button -->
    <button id="shareBtn" class="share-btn" onclick="mindMapApp?.openShareModal()" style="display: none;">
        <svg class="icon icon--sm" aria-hidden="true"><use href="#i-send"></use></svg> Share
    </button>

    <!-- Connection Status -->
    <div id="connectionStatus" class="connection-status">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Disconnected</span>
    </div>

    <!-- App Container -->
    <div id="appContainer" class="app-container hidden">
        <!-- Header -->
        <div class="app-header">
            <div class="header-left">
                <h1><svg class="icon" aria-hidden="true"><use href="#i-layers"></use></svg> Mind Map</h1>
                <span id="roomName" class="room-badge"></span>
            </div>
            <div class="header-right">
                <span id="nodeCount" class="node-count">
                    <svg class="icon icon--sm" aria-hidden="true"><use href="#i-layers"></use></svg>
                    <span id="nodeCountNum">0</span> nodes
                </span>
                <span id="userCount" class="user-count">
                    <svg class="icon icon--sm" aria-hidden="true"><use href="#i-users"></use></svg> <span id="userCountNum">0</span>
                </span>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-group">
                <button class="toolbar-btn" onclick="mindMapApp?.addNode()" title="Add Node (A)"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg></button>
                <button class="toolbar-btn" onclick="mindMapApp?.deleteSelected()" title="Delete (Del)"><svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg></button>
            </div>

            <div class="toolbar-separator"></div>

            <div class="toolbar-group">
                <button class="toolbar-btn" onclick="mindMapApp?.zoomIn()" title="Zoom In (+)"><svg class="icon" aria-hidden="true"><use href="#i-zoom-in"></use></svg></button>
                <button class="toolbar-btn" onclick="mindMapApp?.zoomOut()" title="Zoom Out (-)"><svg class="icon" aria-hidden="true"><use href="#i-zoom-out"></use></svg></button>
                <button class="toolbar-btn" onclick="mindMapApp?.resetView()" title="Reset View (0)"><svg class="icon" aria-hidden="true"><use href="#i-target"></use></svg></button>
            </div>

            <div class="toolbar-separator"></div>

            <div class="toolbar-group">
                <button class="toolbar-btn" onclick="mindMapApp?.clearAll()" title="Clear All"><svg class="icon" aria-hidden="true"><use href="#i-ban"></use></svg></button>
                <button class="toolbar-btn" onclick="mindMapApp?.exportImage()" title="Export PNG"><svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg></button>
                <button class="toolbar-btn" onclick="mindMapApp?.exportJSON()" title="Export JSON"><svg class="icon" aria-hidden="true"><use href="#i-code"></use></svg></button>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="canvas-container">
            <canvas id="mindMapCanvas"></canvas>

            <!-- Remote Cursors Container -->
            <div id="cursorsContainer" class="cursors-container"></div>

            <!-- Context Menu -->
            <div id="contextMenu" class="context-menu hidden">
                <button onclick="mindMapApp?.contextMenuAction('edit')"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-pen"></use></svg> Edit Text</button>
                <button onclick="mindMapApp?.contextMenuAction('color')"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-layers"></use></svg> Change Color</button>
                <button onclick="mindMapApp?.contextMenuAction('connect')"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-channel"></use></svg> Connect Nodes</button>
                <button onclick="mindMapApp?.contextMenuAction('delete')"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-trash"></use></svg> Delete</button>
            </div>

            <!-- Color Picker Dialog -->
            <div id="colorPickerDialog" class="color-picker-dialog hidden">
                <h3>Choose Node Color</h3>
                <div class="color-grid">
                    <button class="color-option" data-color="#3b82f6" style="background: #3b82f6"></button>
                    <button class="color-option" data-color="#ef4444" style="background: #ef4444"></button>
                    <button class="color-option" data-color="#10b981" style="background: #10b981"></button>
                    <button class="color-option" data-color="#f59e0b" style="background: #f59e0b"></button>
                    <button class="color-option" data-color="#8b5cf6" style="background: #8b5cf6"></button>
                    <button class="color-option" data-color="#ec4899" style="background: #ec4899"></button>
                    <button class="color-option" data-color="#06b6d4" style="background: #06b6d4"></button>
                    <button class="color-option" data-color="#84cc16" style="background: #84cc16"></button>
                </div>
                <button onclick="mindMapApp?.closeColorPicker()">Cancel</button>
            </div>
        </div>

        <!-- Users Panel -->
        <div class="users-panel">
            <h3 data-agents-header><svg class="icon icon--sm" aria-hidden="true"><use href="#i-users"></use></svg> Collaborators</h3>
            <div id="usersList" class="users-list"></div>
        </div>
    </div>

    <!-- Text Edit Modal -->
    <div id="textEditModal" class="text-edit-modal hidden">
        <div class="modal-content">
            <h3>Edit Node Text</h3>
            <input type="text" id="nodeTextInput" placeholder="Enter node text..." maxlength="100">
            <div class="modal-actions">
                <button class="btn-primary" onclick="mindMapApp?.saveNodeText()">Save</button>
                <button class="btn-secondary" onclick="mindMapApp?.cancelNodeEdit()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Include Libraries -->
    <script src="../../js/config-loader.js"></script>
    <script src="../../js/icons.js"></script>
    <script src="../../js/ui.js"></script>
    <script src="../../lib/qrcode.min.js"></script>
    <script src="../../generated-web-agent-js/js/web-agent.libs.js"></script>
    <script src="../../generated-web-agent-js/js/web-agent.js"></script>
    <script src="../../generated-web-agent-js/js/web-agent.webrtc.js"></script>
    <script src="../../js/UserConnectionBase.js"></script>

    <!-- App Logic -->
    <script src="mind-map.js"></script>

    <!-- Connection Modal & Share -->
    <script src="../../js/dialog.js"></script>
    <script src="../../js/common-utils.js"></script>
    <script src="../../js/connection-modal.js"></script>
    <script src="../../js/share-modal.js"></script>
<script src="../../js/app-chrome.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../js/prod-log.js"></script>
    <link rel="icon" type="image/svg+xml" href="../../../favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Quiz Battle — real-time trivia on the Messaging Platform SDK</title>
    <meta name="description" content="Head-to-head trivia scored on speed as well as accuracy. Share the room link and everyone answers on their own screen.">
    <meta name="theme-color" content="#0b1120">
    <link rel="canonical" href="https://hmdevonline.com/messaging-platform/sdk/apps/mini-games/quiz-battle/index.html">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Messaging Platform SDK">
    <meta property="og:title" content="Quiz Battle — real-time trivia">
    <meta property="og:description" content="Head-to-head trivia scored on speed as well as accuracy. Share the room link and everyone answers on their own screen.">
    <meta property="og:url" content="https://hmdevonline.com/messaging-platform/sdk/apps/mini-games/quiz-battle/index.html">
    <meta property="og:image" content="https://hmdevonline.com/messaging-platform/sdk/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="../../../css/design-tokens.css">
    <link rel="stylesheet" href="../../../css/ui.css">
    <link rel="stylesheet" href="../../../css/sdk-app.css">
    <link rel="stylesheet" href="../../../css/toast.css">
    <link rel="stylesheet" href="../../../css/share-modal.css">
    <link rel="stylesheet" href="../../../css/connection-modal.css">
    <link rel="stylesheet" href="quiz-battle.css">
    <link rel="stylesheet" href="../../../css/app-chrome.css">
</head>
<body class="sdk-app">
    <!-- Connection Modal will be loaded dynamically -->

    <header class="sdk-header top-bar">
        <span class="sdk-header__mark">
            <svg class="icon" aria-hidden="true"><use href="#i-gamepad"></use></svg>
        </span>
        <h1>Quiz Battle</h1>
        <span class="sdk-room" id="quizRoomName">not connected</span>

        <div class="sdk-header__right">
            <button class="btn btn--ghost" id="shareBtn" type="button" hidden
                    title="Invite someone (QR or link)">
                <svg class="icon icon--sm" aria-hidden="true"><use href="#i-qr-code"></use></svg>
                <span>Invite</span>
            </button>
        </div>
    </header>

    <main class="sdk-stage">
        <div class="sdk-main quiz-main">
            <div class="quiz-stats" role="group" aria-label="Game status">
                <div class="quiz-stat">
                    <span class="quiz-stat__icon">
                        <svg class="icon" aria-hidden="true"><use href="#i-trophy"></use></svg>
                    </span>
                    <div>
                        <div class="quiz-stat__label">Your score</div>
                        <div class="quiz-stat__value" id="yourScore">0</div>
                    </div>
                </div>
                <div class="quiz-stat">
                    <span class="quiz-stat__icon">
                        <svg class="icon" aria-hidden="true"><use href="#i-flag"></use></svg>
                    </span>
                    <div>
                        <div class="quiz-stat__label">Question</div>
                        <div class="quiz-stat__value" id="questionNum">0/10</div>
                    </div>
                </div>
                <div class="quiz-stat">
                    <span class="quiz-stat__icon">
                        <svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg>
                    </span>
                    <div>
                        <div class="quiz-stat__label">Players</div>
                        <div class="quiz-stat__value" id="playerCount">1</div>
                    </div>
                </div>
                <div class="quiz-stat">
                    <span class="quiz-stat__icon">
                        <svg class="icon" aria-hidden="true"><use href="#i-timer"></use></svg>
                    </span>
                    <div>
                        <div class="quiz-stat__label">Time left</div>
                        <div class="quiz-stat__value" id="timeLeft">10s</div>
                    </div>
                </div>
            </div>

            <section class="card quiz-card" id="quizContainer" aria-live="polite">
                <!-- Content will be dynamically inserted -->
            </section>
        </div>
    </main>

    <!-- Load SDK Scripts from generated folder (copied at build time) -->
    <script src="../../../js/config-loader.js"></script>
    <script src="../../../lib/qrcode.min.js"></script>
    <script src="../../../generated-web-agent-js/js/web-agent.libs.js"></script>
    <script src="../../../generated-web-agent-js/js/web-agent.js"></script>
    <script src="../../../generated-web-agent-js/js/web-agent.webrtc.js"></script>

    <!-- Icon sprite + demo-specific scripts from static/js -->
    <script src="../../../js/icons.js"></script>
    <script src="../../../js/share-modal.js"></script>
    <script src="../../../js/dialog.js"></script>
    <script src="../../../js/common-utils.js"></script>
    <script src="../../../js/connection-modal.js"></script>

    <!-- Common Game Framework -->
    <script src="../../../js/UserConnectionBase.js"></script>

    <!-- Question Generator -->
    <script src="question-generator.js"></script>

    <!-- Shared game kit (confetti / effects) -->
    <script src="../shared/game-kit.js"></script>

    <!-- Game Script -->
    <script src="quiz-battle.js"></script>

    <script>
        // Setup channel cleanup on page unload
        if (typeof MiniGameUtils !== 'undefined' && typeof MiniGameUtils.setupCleanupOnUnload === 'function') {
            MiniGameUtils.setupCleanupOnUnload(() => window.quizChannel, 'Quiz Battle');
        }
    </script>
<script src="../../../js/app-chrome.js"></script>
</body>
</html>

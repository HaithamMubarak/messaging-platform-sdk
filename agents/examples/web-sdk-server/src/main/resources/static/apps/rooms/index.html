<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Rooms — video and screen share on the Messaging Platform SDK</title>
    <meta name="description" content="Camera, microphone and screen share in a shared room. The streams go peer to peer; the channel only carries who is here and who is presenting.">
    <meta name="theme-color" content="#0b1120">

    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <link rel="stylesheet" href="../../css/design-tokens.css">
    <link rel="stylesheet" href="../../css/ui.css">
    <link rel="stylesheet" href="../../css/sdk-app.css">
    <link rel="stylesheet" href="../../css/toast.css">
    <link rel="stylesheet" href="../../css/connection-modal.css">
    <link rel="stylesheet" href="../../css/share-modal.css">
    <link rel="stylesheet" href="rooms.css">

    <script src="../../js/prod-log.js"></script>
</head>
<body class="sdk-app">

<header class="sdk-header">
    <span class="sdk-header__mark">
        <svg class="icon" aria-hidden="true"><use href="#i-video"></use></svg>
    </span>
    <h1>Rooms</h1>
    <span class="sdk-room" id="roomName">not connected</span>

    <div class="sdk-header__right">
        <span class="pill-status is-off" id="statusPill">
            <span class="pill-status__dot"></span>
            <span class="pill-status__text">Not connected</span>
        </span>
        <button class="btn btn--ghost" id="shareBtn" type="button" title="Invite someone (QR or link)">
            <svg class="icon icon--sm" aria-hidden="true"><use href="#i-qr-code"></use></svg>
            <span>Invite</span>
        </button>
        <a class="btn btn--ghost sdk-header__away" href="../../playground.html">
            <svg class="icon icon--sm" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
            <span>Playground</span>
        </a>
    </div>
</header>

<main class="sdk-stage">
    <div class="sdk-main">
        <section class="stage" id="stage" aria-label="Shared screen"></section>

        <div class="controls">
            <button class="btn" id="micBtn" type="button" title="Microphone (M)">
                <svg class="icon icon--sm" aria-hidden="true"><use href="#i-mic-off"></use></svg>
                <span>Unmute</span>
            </button>
            <button class="btn" id="camBtn" type="button" title="Camera (V)">
                <svg class="icon icon--sm" aria-hidden="true"><use href="#i-video-off"></use></svg>
                <span>Camera</span>
            </button>
            <button class="btn" id="shareScreenBtn" type="button" title="Share your screen (S)">
                <svg class="icon icon--sm" aria-hidden="true"><use href="#i-monitor"></use></svg>
                <span>Share screen</span>
            </button>

            <div class="controls__menu">
                <button class="btn btn--icon" id="gearBtn" type="button" aria-label="Camera and microphone">
                    <svg class="icon icon--sm" aria-hidden="true"><use href="#i-settings"></use></svg>
                </button>
                <div class="menu" id="deviceMenu" hidden>
                    <label class="menu__row">
                        <span class="menu__label">Camera</span>
                        <select class="menu__select" id="camPick" disabled></select>
                    </label>
                    <label class="menu__row">
                        <span class="menu__label">Microphone</span>
                        <select class="menu__select" id="micPick" disabled></select>
                    </label>
                    <p class="menu__note">Device names appear once you allow access.</p>
                </div>
            </div>

            <button class="btn btn--icon" id="viewBtn" type="button" title="Show everyone (G)" aria-label="Show everyone">
                <svg class="icon icon--sm" aria-hidden="true"><use href="#i-grid"></use></svg>
            </button>

            <span class="controls__stats" id="connStats">0 peers</span>
            <button class="btn btn--danger" id="leaveBtn" type="button">
                <svg class="icon icon--sm" aria-hidden="true"><use href="#i-log-out"></use></svg>
                <span>Leave</span>
            </button>
        </div>
    </div>

    <aside class="sdk-side sdk-side--wide is-people" id="side">
        <div class="tabs" role="tablist" aria-label="Room panel">
            <button class="tabs__btn is-on" id="tabPeople" type="button" role="tab" aria-selected="true">
                People <span class="tabs__n" id="peopleCountTab">0</span>
            </button>
            <button class="tabs__btn" id="tabChat" type="button" role="tab" aria-selected="false">
                Chat <span class="tabs__n tabs__n--unread" id="unreadCount" hidden>0</span>
            </button>
        </div>

        <div class="side__pane side__pane--people">
            <div class="sdk-side__title">
                <span>In the room</span>
                <span id="peopleCount" style="font-weight:500">0</span>
            </div>
            <div class="people" id="people"></div>
        </div>

        <div class="side__pane side__pane--chat">
            <div class="sdk-side__title">
                <span>Room chat</span>
            </div>
            <div class="sdk-scroll log" id="log"></div>

            <form class="composer" id="chatForm">
            <input id="chatInput" class="composer__input" type="text" maxlength="800"
                   placeholder="Message the room…" autocomplete="off">
            <button class="btn btn--primary btn--icon" type="submit" aria-label="Send">
                <svg class="icon icon--sm" aria-hidden="true"><use href="#i-send"></use></svg>
            </button>
            </form>
        </div>
    </aside>
</main>

<script src="../../js/config-loader.js"></script>
<script src="../../generated-web-agent-js/js/web-agent.libs.js"></script>
<script src="../../generated-web-agent-js/js/web-agent.js"></script>
<script src="../../generated-web-agent-js/js/web-agent.webrtc.js"></script>
<script src="../../js/icons.js"></script>
<script src="../../js/ui.js"></script>
<script src="../../lib/qrcode.min.js"></script>
<script src="../../js/share-modal.js"></script>
<script src="../../js/dialog.js"></script>
<script src="../../js/common-utils.js"></script>
<script src="../../js/connection-modal.js"></script>
<script src="../../js/UserConnectionBase.js"></script>
<script src="rooms.js"></script>
</body>
</html>

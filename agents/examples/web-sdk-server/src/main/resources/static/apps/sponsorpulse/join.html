<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
    <title>Join the event · SponsorPulse</title>
    <meta name="description" content="Scan, type a name, and take part. No account, no app.">
    <!-- An attendee link is handed out at an event; it should not be indexed. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0b1120">
    <link rel="stylesheet" href="../../css/design-tokens.css">
    <link rel="stylesheet" href="../../css/ui.css">
    <link rel="stylesheet" href="sponsorpulse.css">
    <script src="../../js/prod-log.js"></script>
</head>
<body class="sp">

<header class="sp-brand">
    <img id="brandLogo" class="sp-brand__logo" alt="" hidden>
    <div class="sp-brand__text">
        <span id="brandName" class="sp-brand__name">SponsorPulse</span>
        <span id="brandEvent" class="sp-brand__event"></span>
    </div>
    <span class="sp-brand__spacer"></span>
    <label class="sr-only" for="langPick">Language</label>
    <select id="langPick" class="btn btn--sm" style="min-height:44px"></select>
</header>

<!-- Step 1: who are you. Nothing is asked beyond a display name. -->
<main id="joinStep" class="sp-stage">
    <h1 class="sp-prompt" data-i18n="enterName">Enter your name to join</h1>
    <div class="sp-field">
        <label for="attendeeName" data-i18n="yourName">Your name</label>
        <input id="attendeeName" type="text" maxlength="40" autocomplete="nickname"
               data-i18n-ph="yourName" enterkeyhint="go">
    </div>

    <div class="sp-consent">
        <input type="checkbox" id="consent">
        <label for="consent" class="sp-consent__text" data-i18n="consentLabel">
            Keep me posted about this event and offers from the sponsor
        </label>
    </div>
    <div class="sp-field" id="emailField" hidden>
        <label for="attendeeEmail" data-i18n="optionalEmail">Email (optional)</label>
        <input id="attendeeEmail" type="email" autocomplete="email" inputmode="email">
    </div>
    <p class="sp-privacy" data-i18n="privacy"></p>

    <button id="joinBtn" class="btn btn--primary" style="min-height:52px">
        <span data-i18n="join">Join</span>
    </button>
    <p id="joinError" class="sp-privacy" style="color:var(--danger)" role="alert"></p>
</main>

<!-- Step 2: whatever the room is doing now. -->
<main id="liveStep" class="sp-stage" hidden>
    <div id="sponsorSlot" hidden></div>
    <div id="segment"></div>
    <section id="boardSection" hidden>
        <h2 class="sp-panel__title" data-i18n="leaderboard">Leaderboard</h2>
        <div id="board" class="sp-board"></div>
    </section>
</main>

<div id="toast" class="sp-toast" hidden role="status" aria-live="polite"></div>

<script src="../../js/config-loader.js"></script>
<script src="../../js/api-config.js"></script>
<script src="../../generated-web-agent-js/js/web-agent.libs.js"></script>
<script src="../../generated-web-agent-js/js/web-agent.js"></script>
<script src="../../generated-web-agent-js/js/web-agent.webrtc.js"></script>
<script src="../../js/common-utils.js"></script>
<script src="../../js/UserConnectionBase.js"></script>
<script src="sponsorpulse-i18n.js"></script>
<script src="sponsorpulse-core.js"></script>
<script src="join.js"></script>
</body>
</html>

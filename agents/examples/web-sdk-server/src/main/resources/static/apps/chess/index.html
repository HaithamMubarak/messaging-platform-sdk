<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../js/prod-log.js"></script>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
    <meta name="theme-color" content="#0b1120">
    <title>♟️ Chess - Multiplayer</title>
    <meta name="description" content="Two-player chess with full rules and a board another player restores for you after a refresh. Share the room link and make your move.">
    <link rel="canonical" href="https://hmdevonline.com/messaging-platform/sdk/apps/chess/index.html">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Messaging Platform SDK">
    <meta property="og:title" content="Chess — multiplayer">
    <meta property="og:description" content="Two-player chess with full rules and a board another player restores for you after a refresh. Share the room link and make your move.">
    <meta property="og:url" content="https://hmdevonline.com/messaging-platform/sdk/apps/chess/index.html">
    <meta property="og:image" content="https://hmdevonline.com/messaging-platform/sdk/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">

    <!-- The shared design system: tokens first, then the kit, then this app. -->
    <link rel="stylesheet" href="../../css/design-tokens.css">
    <link rel="stylesheet" href="../../css/ui.css">

    <!-- Common Styles -->
    <link rel="stylesheet" href="../../css/toast.css">
    <link rel="stylesheet" href="../../css/connection-modal.css">
    <link rel="stylesheet" href="../../css/share-modal.css">

    <!-- Chess Styles -->
    <link rel="stylesheet" href="chess.css">
    <link rel="stylesheet" href="../../css/app-chrome.css">

    <!-- Chess.js Library (for game logic) - LOCAL VERSION -->
    <script src="lib/chess.min.js"></script>
</head>
<body>
    <!-- Share Button -->
    <button id="shareBtn" class="share-btn" onclick="chessGame?.openShareModal()" style="display: none;">
        <svg class="icon icon--sm" aria-hidden="true"><use href="#i-send"></use></svg> Share
    </button>

    <!-- Connection Status -->
    <div id="connectionStatus" class="connection-status">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Disconnected</span>
    </div>

    <!-- Game Container -->
    <div id="gameContainer" class="game-container hidden">
        <!-- Header -->
        <div class="game-header">
            <div class="header-left">
                <h1>♟️ Chess</h1>
                <span id="roomName" class="room-badge"></span>
            </div>
            <div class="header-center">
                <div id="gameStatus" class="game-status">
                    Waiting for players...
                </div>
            </div>
            <div class="header-right">
                <div id="turnIndicator" class="turn-indicator">
                    <span id="turnText">White's Turn</span>
                </div>
            </div>
        </div>

        <!-- Main Layout -->
        <div class="game-layout">
            <!-- Left Sidebar: Players & Info -->
            <div class="sidebar-left">
                <!-- Black Player -->
                <div class="player-panel black-player">
                    <div class="player-icon">♚</div>
                    <div class="player-info">
                        <div class="player-name" id="blackPlayerName">Waiting...</div>
                        <div class="player-status" id="blackPlayerStatus">⏳</div>
                    </div>
                    <div class="captured-pieces" id="blackCaptured"></div>
                </div>

                <!-- White Player -->
                <div class="player-panel white-player">
                    <div class="player-icon">♔</div>
                    <div class="player-info">
                        <div class="player-name" id="whitePlayerName">Waiting...</div>
                        <div class="player-status" id="whitePlayerStatus">⏳</div>
                    </div>
                    <div class="captured-pieces" id="whiteCaptured"></div>
                </div>

                <!-- Spectators -->
                <div class="spectators-panel">
                    <h3><svg class="icon icon--sm" aria-hidden="true"><use href="#i-eye"></use></svg> Spectators (<span id="spectatorCount">0</span>)</h3>
                    <div id="spectatorsList" class="spectators-list"></div>
                </div>
            </div>

            <!-- Center: Chess Board -->
            <div class="board-area">
                <div id="chessBoard" class="chess-board"></div>

                <!-- Promotion Dialog -->
                <div id="promotionDialog" class="promotion-dialog hidden">
                    <h3>Choose promotion piece:</h3>
                    <div class="promotion-choices">
                        <button class="promotion-btn" data-piece="q">♛</button>
                        <button class="promotion-btn" data-piece="r">♜</button>
                        <button class="promotion-btn" data-piece="b">♝</button>
                        <button class="promotion-btn" data-piece="n">♞</button>
                    </div>
                </div>
            </div>

            <!-- Right Sidebar: Move History & Controls -->
            <div class="sidebar-right">
                <div class="controls-panel">
                    <h3><svg class="icon icon--sm" aria-hidden="true"><use href="#i-gamepad"></use></svg> Controls</h3>
                    <button id="newGameBtn" class="btn-secondary" onclick="chessGame?.requestNewGame()" disabled>
                        <svg class="icon icon--sm" aria-hidden="true"><use href="#i-refresh"></use></svg> New Game
                    </button>
                    <button id="resignBtn" class="btn-danger" onclick="chessGame?.resign()" disabled>
                        <svg class="icon icon--sm" aria-hidden="true"><use href="#i-ban"></use></svg> Resign
                    </button>
                    <button id="offerDrawBtn" class="btn-secondary" onclick="chessGame?.offerDraw()" disabled>
                        <svg class="icon icon--sm" aria-hidden="true"><use href="#i-check"></use></svg> Offer Draw
                    </button>
                </div>

                <div class="moves-panel">
                    <h3><svg class="icon icon--sm" aria-hidden="true"><use href="#i-list"></use></svg> Move History</h3>
                    <div id="moveHistory" class="move-history"></div>
                    <div class="move-actions">
                        <button id="exportPgn" class="btn btn--sm btn--ghost" type="button"
                                onclick="chessGame?.exportPgn()">
                            Export PGN
                        </button>
                        <label for="importPgn" class="btn btn--sm btn--ghost" style="cursor:pointer">
                            Load PGN
                            <input id="importPgn" type="file" accept=".pgn,text/plain"
                                   style="display:none"
                                   onchange="chessGame?.loadPgnFile(this.files[0]); this.value='';">
                        </label>
                        <span id="clockWhite" class="clock" title="White's thinking time">W 0:00</span>
                        <span id="clockBlack" class="clock" title="Black's thinking time">B 0:00</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lobby Panel -->
        <div id="lobbyPanel" class="lobby-panel">
            <h2>♟️ Chess Lobby</h2>
            <p>Choose your color:</p>
            <div class="color-choice">
                <button class="color-btn" onclick="chessGame?.chooseColor('white')">
                    ♔ Play as White
                </button>
                <button class="color-btn" onclick="chessGame?.chooseColor('black')">
                    ♚ Play as Black
                </button>
                <button class="color-btn spectate" onclick="chessGame?.chooseSpectator()">
                    👀 Spectate
                </button>
            </div>
        </div>
    </div>

    <!-- Include Libraries (dependencies must load before the game) -->
    <script src="../../js/config-loader.js"></script>
    <script src="../../js/icons.js"></script>
    <script src="../../js/ui.js"></script>
    <script src="../../lib/qrcode.min.js"></script>
    <script src="../../generated-web-agent-js/js/web-agent.libs.js"></script>
    <script src="../../generated-web-agent-js/js/web-agent.js"></script>
    <script src="../../generated-web-agent-js/js/web-agent.webrtc.js"></script>
    <script src="../../js/share-modal.js"></script>
    <script src="../../js/dialog.js"></script>
    <script src="../../js/common-utils.js"></script>
    <script src="../../js/mp-account.js"></script>
<script src="../../js/keyring.js"></script>
    <script src="../../js/active-channel.js"></script>
    <script src="../../js/connection-modal.js"></script>
    <script src="../../js/telemetry.js"></script>
    <script src="../../js/UserConnectionBase.js"></script>

    <!-- Game Logic -->
    <script src="chess-game.js"></script>
<script src="../../js/app-chrome.js"></script>
</body>
</html>

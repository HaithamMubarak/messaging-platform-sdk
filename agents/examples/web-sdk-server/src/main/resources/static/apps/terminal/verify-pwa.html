<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Status Checker - SDK Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0a0a14 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #4a9eff;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            color: #8a8a9e;
            margin-bottom: 30px;
        }
        .check-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .check-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
        }
        .check-item .icon {
            font-size: 24px;
            margin-right: 12px;
            min-width: 30px;
        }
        .check-item .label {
            flex: 1;
            font-weight: 500;
        }
        .check-item .status {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .status.pass {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        .status.fail {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }
        .status.checking {
            background: rgba(74, 158, 255, 0.2);
            color: #4a9eff;
        }
        .btn {
            background: linear-gradient(135deg, #4a9eff 0%, #3a8eef 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 10px 10px 10px 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(74, 158, 255, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 158, 255, 0.4);
        }
        .overall-status {
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: 600;
        }
        .overall-status.ready {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.2) 0%, rgba(34, 211, 238, 0.2) 100%);
            border: 2px solid #4ade80;
        }
        .overall-status.not-ready {
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.2) 0%, rgba(251, 191, 36, 0.2) 100%);
            border: 2px solid #f87171;
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }
        .icon-preview {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
        }
        .icon-preview img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
        }
        .icon-preview .size {
            font-size: 11px;
            color: #8a8a9e;
            margin-top: 4px;
        }
        .details {
            font-size: 13px;
            color: #c0c0d0;
            margin-top: 8px;
            padding-left: 42px;
        }
        .code {
            background: rgba(74, 158, 255, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            color: #4a9eff;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 PWA Status Checker</h1>
        <p class="subtitle">Verify that SDK Terminal is ready to be installed as a PWA</p>

        <div id="overallStatus" class="overall-status checking">
            🔄 Checking PWA requirements...
        </div>

        <div class="check-section">
            <h3 style="color: #4a9eff; margin-bottom: 16px;">📋 Requirements Checklist</h3>

            <div class="check-item" id="check-https">
                <div class="icon">🔒</div>
                <div class="label">HTTPS or Localhost</div>
                <div class="status checking">Checking...</div>
            </div>

            <div class="check-item" id="check-manifest">
                <div class="icon">📄</div>
                <div class="label">Valid Manifest</div>
                <div class="status checking">Checking...</div>
            </div>
            <div class="details" id="manifest-details"></div>

            <div class="check-item" id="check-sw">
                <div class="icon">⚙️</div>
                <div class="label">Service Worker</div>
                <div class="status checking">Checking...</div>
            </div>
            <div class="details" id="sw-details"></div>

            <div class="check-item" id="check-icons">
                <div class="icon">🎨</div>
                <div class="label">Icons (8 sizes)</div>
                <div class="status checking">Checking...</div>
            </div>
            <div class="details" id="icons-details"></div>

            <div class="check-item" id="check-installable">
                <div class="icon">📲</div>
                <div class="label">Installable</div>
                <div class="status checking">Checking...</div>
            </div>
            <div class="details" id="install-details"></div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="btn" onclick="checkAgain()">🔄 Check Again</button>
            <button class="btn" onclick="openTerminal()">🖥️ Open Terminal</button>
            <button class="btn" onclick="openDevTools()">🛠️ View DevTools Tips</button>
        </div>
    </div>

    <script>
        const iconSizes = [72, 96, 128, 144, 152, 192, 384, 512];
        let checkResults = {
            https: false,
            manifest: false,
            serviceWorker: false,
            icons: false,
            installable: false
        };

        async function runAllChecks() {
            await checkHTTPS();
            await checkManifest();
            await checkServiceWorker();
            await checkIcons();
            await checkInstallable();
            updateOverallStatus();
        }

        function checkHTTPS() {
            const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            const el = document.getElementById('check-https');
            const status = el.querySelector('.status');

            if (isSecure) {
                status.textContent = '✓ Pass';
                status.className = 'status pass';
                checkResults.https = true;
            } else {
                status.textContent = '✗ Fail';
                status.className = 'status fail';
                checkResults.https = false;
            }
        }

        async function checkManifest() {
            const el = document.getElementById('check-manifest');
            const status = el.querySelector('.status');
            const details = document.getElementById('manifest-details');

            try {
                const response = await fetch('./manifest.json');
                const manifest = await response.json();

                status.textContent = '✓ Pass';
                status.className = 'status pass';
                checkResults.manifest = true;

                details.innerHTML = `
                    Name: <span class="code">${manifest.short_name}</span><br>
                    Display: <span class="code">${manifest.display}</span><br>
                    Icons defined: <span class="code">${manifest.icons.length}</span>
                `;
            } catch (error) {
                status.textContent = '✗ Fail';
                status.className = 'status fail';
                checkResults.manifest = false;
                details.innerHTML = `Error: ${error.message}`;
            }
        }

        async function checkServiceWorker() {
            const el = document.getElementById('check-sw');
            const status = el.querySelector('.status');
            const details = document.getElementById('sw-details');

            if (!('serviceWorker' in navigator)) {
                status.textContent = '✗ Not Supported';
                status.className = 'status fail';
                checkResults.serviceWorker = false;
                details.innerHTML = 'Service Workers not supported in this browser';
                return;
            }

            try {
                const registration = await navigator.serviceWorker.getRegistration();

                if (registration) {
                    status.textContent = '✓ Registered';
                    status.className = 'status pass';
                    checkResults.serviceWorker = true;

                    const swState = registration.active ? registration.active.state : 'installing';
                    details.innerHTML = `
                        Status: <span class="code">${swState}</span><br>
                        Scope: <span class="code">${registration.scope}</span>
                    `;
                } else {
                    status.textContent = '⚠ Not Registered';
                    status.className = 'status fail';
                    checkResults.serviceWorker = false;
                    details.innerHTML = 'Service worker not registered. Open the terminal app to register it.';
                }
            } catch (error) {
                status.textContent = '✗ Error';
                status.className = 'status fail';
                checkResults.serviceWorker = false;
                details.innerHTML = `Error: ${error.message}`;
            }
        }

        async function checkIcons() {
            const el = document.getElementById('check-icons');
            const status = el.querySelector('.status');
            const details = document.getElementById('icons-details');

            let foundIcons = 0;
            let iconsHTML = '<div class="icon-grid">';

            for (const size of iconSizes) {
                const iconPath = `./icons/icon-${size}x${size}.png`;

                try {
                    const response = await fetch(iconPath, { method: 'HEAD' });
                    if (response.ok) {
                        foundIcons++;
                        iconsHTML += `
                            <div class="icon-preview">
                                <img src="${iconPath}" alt="${size}x${size}">
                                <div class="size">${size}x${size} ✓</div>
                            </div>
                        `;
                    }
                } catch (error) {
                    iconsHTML += `
                        <div class="icon-preview" style="opacity: 0.3;">
                            <div style="width: 48px; height: 48px; background: rgba(248,113,113,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center;">✗</div>
                            <div class="size">${size}x${size}</div>
                        </div>
                    `;
                }
            }

            iconsHTML += '</div>';
            details.innerHTML = `Found: <span class="code">${foundIcons}/${iconSizes.length}</span> icons` + iconsHTML;

            if (foundIcons === iconSizes.length) {
                status.textContent = '✓ All Present';
                status.className = 'status pass';
                checkResults.icons = true;
            } else if (foundIcons >= 2) {
                status.textContent = `⚠ ${foundIcons}/${iconSizes.length}`;
                status.className = 'status fail';
                checkResults.icons = false;
            } else {
                status.textContent = '✗ Missing';
                status.className = 'status fail';
                checkResults.icons = false;
            }
        }

        function checkInstallable() {
            const el = document.getElementById('check-installable');
            const status = el.querySelector('.status');
            const details = document.getElementById('install-details');

            // Check if already installed
            const isInstalled = window.matchMedia('(display-mode: standalone)').matches ||
                              window.navigator.standalone === true;

            if (isInstalled) {
                status.textContent = '✓ Installed';
                status.className = 'status pass';
                checkResults.installable = true;
                details.innerHTML = 'App is already installed and running in standalone mode!';
            } else if (checkResults.https && checkResults.manifest && checkResults.serviceWorker && checkResults.icons) {
                status.textContent = '✓ Ready';
                status.className = 'status pass';
                checkResults.installable = true;
                details.innerHTML = 'Open the terminal app and look for the install prompt or button!';
            } else {
                status.textContent = '✗ Not Ready';
                status.className = 'status fail';
                checkResults.installable = false;
                details.innerHTML = 'Fix the failed checks above to enable installation.';
            }
        }

        function updateOverallStatus() {
            const el = document.getElementById('overallStatus');
            const allPass = Object.values(checkResults).every(v => v === true);

            if (allPass) {
                el.className = 'overall-status ready';
                el.innerHTML = '✅ PWA Ready! SDK Terminal can be installed as an app!';
            } else {
                el.className = 'overall-status not-ready';
                const failed = Object.entries(checkResults).filter(([k, v]) => !v).map(([k]) => k).join(', ');
                el.innerHTML = `⚠️ Not Ready - Please fix: ${failed}`;
            }
        }

        function checkAgain() {
            // Reset all to checking
            document.querySelectorAll('.status').forEach(s => {
                s.textContent = 'Checking...';
                s.className = 'status checking';
            });
            document.querySelectorAll('.details').forEach(d => d.innerHTML = '');

            runAllChecks();
        }

        function openTerminal() {
            window.open('./index.html', '_blank');
        }

        function openDevTools() {
            alert(`💡 DevTools Tips:\n\n1. Press F12 to open DevTools\n2. Go to "Application" tab\n3. Check:\n   - Manifest section (should show all icons)\n   - Service Workers (should show "activated")\n   - Storage (check cache)\n\n4. To test offline:\n   - Network tab → Check "Offline"\n   - Reload page → Should still work!`);
        }

        // Run checks on load
        runAllChecks();
    </script>
</body>
</html>

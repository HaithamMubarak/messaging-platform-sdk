<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>QuickShare has become Drop</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://hmdevonline.com/messaging-platform/sdk/apps/drop/index.html">
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <link rel="stylesheet" href="../../css/design-tokens.css">
    <link rel="stylesheet" href="../../css/ui.css">
    <script src="../../js/icons.js" defer></script>

    <!-- QuickShare was the first peer-to-peer file drop built on the SDK, and
         Drop is the same idea done properly: the file is offered and the other
         person accepts before a byte moves, it is on the design system, and it
         is the one that gets maintained. QuickShare pushed straight into your
         tab with no consent step, which is not a pattern worth demonstrating.

         This page stays as a redirect because the old link is in the wild. -->
    <meta http-equiv="refresh" content="4; url=../drop/index.html">
    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: var(--sp-6);
            background: var(--bg);
            color: var(--text-body);
            font-family: var(--font-sans);
        }
        .card {
            max-width: 34rem;
            padding: var(--sp-10);
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            text-align: center;
        }
        h1 { font-size: var(--fs-2xl); color: var(--text); margin: 0 0 var(--sp-4); }
        p { margin: 0 0 var(--sp-4); text-wrap: pretty; }
        .mark { color: var(--brand-ink); }
    </style>
</head>
<body>
    <div class="card">
        <svg class="icon icon--lg mark" aria-hidden="true"><use href="#i-download"></use></svg>
        <h1>QuickShare is now Drop</h1>
        <p>
            Same idea, built properly: the file is offered and the other person accepts before anything
            moves, and it still goes straight between the two browsers without touching a server.
        </p>
        <p>Taking you there in a moment.</p>
        <p>
            <a class="btn btn--primary" href="../drop/index.html">
                Open Drop
                <svg class="icon icon--sm" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
            </a>
        </p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../../../js/prod-log.js"></script>
    <link rel="icon" type="image/svg+xml" href="../../../favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Player Reactor - Reaction Speed Game</title>
    <meta name="description" content="Four operators, one unstable reactor, and instructions only your neighbour can read. Co-operate fast or it goes critical.">
    <meta name="theme-color" content="#0b1120">
    <link rel="canonical" href="https://hmdevonline.com/messaging-platform/sdk/apps/mini-games/reactor/reactor-client.html">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Messaging Platform SDK">
    <meta property="og:title" content="4-Player Reactor — co-op under pressure">
    <meta property="og:description" content="Four operators, one unstable reactor, and instructions only your neighbour can read. Co-operate fast or it goes critical.">
    <meta property="og:url" content="https://hmdevonline.com/messaging-platform/sdk/apps/mini-games/reactor/reactor-client.html">
    <meta property="og:image" content="https://hmdevonline.com/messaging-platform/sdk/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="../../../css/design-tokens.css">
    <link rel="stylesheet" href="../../../css/ui.css">
    <link rel="stylesheet" href="../../../css/toast.css">
    <link rel="stylesheet" href="reactor-styles.css">
    <link rel="stylesheet" href="../../../css/app-chrome.css">
    <link rel="stylesheet" href="../../../css/share-modal.css">
    <link rel="stylesheet" href="../../../css/connection-modal.css">
</head>
<body>
<!-- Connection Modal will be loaded dynamically by connection-modal.js -->

<!-- Game Container -->
<div id="gameContainer" class="hidden">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="game-info">
            <span class="game-mark">
                <svg class="icon" aria-hidden="true"><use href="#i-zap"></use></svg>
            </span>
            <h1>4-Player Reactor</h1>
            <span id="roomName" class="room-badge"></span>
        </div>

        <div class="game-status">
            <span id="roundInfo" class="status-chip">Round: 0/0</span>
            <span id="timeRemaining" class="status-chip">Time: --</span>
        </div>

        <div class="connection-status" role="status">
            <span id="playerCount">Players: 0</span>
            <span id="connectionIndicator" class="indicator disconnected" aria-hidden="true">●</span>
        </div>

        <button id="shareBtn" class="share-btn btn btn--primary" type="button" style="display:none;">
            <svg class="icon icon--sm" aria-hidden="true"><use href="#i-qr-code"></use></svg>
            <span>Share</span>
        </button>
    </div>

    <!-- Game Arena -->
    <div class="game-arena">
        <!-- Zone 1: Blue (Top-Left) - hidden until player joins -->
        <div class="reaction-zone zone-blue hidden" data-zone="0" id="zone-0" role="button" tabindex="0"
             aria-label="Blue zone" onclick="handleZoneClick(0)"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();handleZoneClick(0);}">
            <div class="zone-content">
                <div class="zone-light" id="light-0"></div>
                <div class="zone-player" id="player-0"></div>
                <div class="zone-score" id="score-0">0</div>
            </div>
        </div>

        <!-- Zone 2: Red (Top-Right) - hidden until player joins -->
        <div class="reaction-zone zone-red hidden" data-zone="1" id="zone-1" role="button" tabindex="0"
             aria-label="Red zone" onclick="handleZoneClick(1)"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();handleZoneClick(1);}">
            <div class="zone-content">
                <div class="zone-light" id="light-1"></div>
                <div class="zone-player" id="player-1"></div>
                <div class="zone-score" id="score-1">0</div>
            </div>
        </div>

        <!-- Zone 3: Green (Bottom-Left) - hidden until player joins -->
        <div class="reaction-zone zone-green hidden" data-zone="2" id="zone-2" role="button" tabindex="0"
             aria-label="Green zone" onclick="handleZoneClick(2)"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();handleZoneClick(2);}">
            <div class="zone-content">
                <div class="zone-light" id="light-2"></div>
                <div class="zone-player" id="player-2"></div>
                <div class="zone-score" id="score-2">0</div>
            </div>
        </div>

        <!-- Zone 4: Yellow (Bottom-Right) - hidden until player joins -->
        <div class="reaction-zone zone-yellow hidden" data-zone="3" id="zone-3" role="button" tabindex="0"
             aria-label="Yellow zone" onclick="handleZoneClick(3)"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();handleZoneClick(3);}">
            <div class="zone-content">
                <div class="zone-light" id="light-3"></div>
                <div class="zone-player" id="player-3"></div>
                <div class="zone-score" id="score-3">0</div>
            </div>
        </div>

        <!-- Center Control Panel -->
        <div class="control-panel">
            <div class="stage-display">
                <span id="currentStageDisplay"><svg class="icon" aria-hidden="true"><use href="#i-zap"></use></svg> Classic Mode</span>
                <button id="stageSelectBtn" class="btn btn--ghost btn--sm hidden" type="button">
                    <svg class="icon icon--sm" aria-hidden="true"><use href="#i-settings"></use></svg>
                    <span>Change Stage</span>
                </button>
            </div>
            <div id="stageInfo" class="stage-info">Basic reaction speed test. Click when your zone lights up!</div>
            <div id="gameMessage" class="game-message">Waiting for players...</div>
            <button id="startButton" onclick="startGame()" class="btn btn--primary btn--lg hidden" type="button">Start Game</button>
        </div>

        <!-- Target Color Display (for Color Match mode) -->
        <div id="targetColorDisplay" class="target-color-display hidden"></div>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard-panel">
        <h3><svg class="icon" aria-hidden="true"><use href="#i-trophy"></use></svg> Leaderboard</h3>
        <div id="leaderboard"></div>

        <div class="stats-panel">
            <h4>Game Stats</h4>
            <div id="gameStats">
                <div class="stat-row">
                    <span>Avg Reaction:</span>
                    <span id="avgReaction">-- ms</span>
                </div>
                <div class="stat-row">
                    <span>Fastest Hit:</span>
                    <span id="fastestHit">-- ms</span>
                </div>
                <div class="stat-row">
                    <span>Total Rounds:</span>
                    <span id="totalRounds">0</span>
                </div>
            </div>
        </div>

        <button onclick="disconnect()" class="btn btn--danger btn--sm" type="button">
            <svg class="icon icon--sm" aria-hidden="true"><use href="#i-log-out"></use></svg>
            <span>Leave Game</span>
        </button>
    </div>
</div>

<!-- Stage Selection Modal (house .modal structure from ui.css; visibility is
     still driven by the game's .hidden class rather than the [hidden] attribute) -->
<div id="stageModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="stageModalTitle">
    <div class="modal__scrim" onclick="closeStageModal()"></div>
    <div class="modal__card modal__card--wide">
        <div class="modal__header">
            <h2 class="modal__title" id="stageModalTitle">Select a stage</h2>
            <button class="modal__close" type="button" onclick="closeStageModal()" aria-label="Close">
                <svg class="icon icon--sm" aria-hidden="true"><use href="#i-x"></use></svg>
            </button>
        </div>
        <div class="modal__body">
            <p class="stage-modal-lede">Choose a game mode to play.</p>
            <div id="stageList" class="stage-list">
                <!-- Stages will be populated by JS -->
            </div>
        </div>
        <div class="modal__actions">
            <button onclick="closeStageModal()" class="btn btn--ghost" type="button">Cancel</button>
        </div>
    </div>
</div>

<!-- Toast Notifications -->
<div id="toastContainer" class="toast-container"></div>

<!-- Scripts -->
<!-- Load SDK Scripts from generated folder (copied at build time) -->
<script src="../../../js/config-loader.js"></script>
<script src="../../../js/icons.js"></script>
<script src="../../../lib/qrcode.min.js"></script>
<script src="../../../generated-web-agent-js/js/web-agent.libs.js"></script>
<script src="../../../generated-web-agent-js/js/web-agent.js"></script>
<script src="../../../generated-web-agent-js/js/web-agent.webrtc.js"></script>

<!-- Load Demo-Specific Scripts -->
<script src="../../../js/share-modal.js"></script>
<script src="../../../js/dialog.js"></script>
<script src="../../../js/common-utils.js"></script>
<script src="../../../js/mp-account.js"></script>
<script src="../../../js/keyring.js"></script>
<script src="../../../js/active-channel.js"></script>
<script src="../../../js/connection-modal.js"></script>
<script src="../../../js/telemetry.js"></script>
<script src="../../../js/UserConnectionBase.js"></script>

<script src="../shared/game-kit.js"></script>

<!-- Game Script -->
<script src="reactor-client.js"></script>
<script src="../../../js/app-chrome.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set your password — Developer Portal</title>
    <meta name="description" content="Replace your temporary password before using the Messaging Platform developer portal.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0b1120">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <link rel="stylesheet" href="../css/design-tokens.css">
    <link rel="stylesheet" href="../css/ui.css">
    <link rel="stylesheet" href="css/developer.css">

    <script>
        if (!sessionStorage.getItem('developer_token')) {
            window.location.replace('index.html');
        }
    </script>
    <script src="../js/prod-log.js" defer></script>
    <script src="../js/icons.js" defer></script>
    <script src="../js/ui.js" defer></script>
    <script src="../js/api-config.js" defer></script>
    <script src="js/developer-api.js" defer></script>
    <script src="js/change-password.js" defer></script>
</head>
<body>
<main class="auth">
    <div class="auth__card">
        <a class="auth__brand" href="../index.html">
            <svg class="logo-mark" aria-hidden="true"><use href="#i-logo"></use></svg>
            Messaging Platform SDK
        </a>

        <h1>Set your password</h1>
        <p>You are signed in with a temporary password. Choose your own to continue.</p>

        <form id="changeForm" novalidate>
            <div class="field">
                <label class="field__label" for="currentPassword">Temporary password</label>
                <input class="field__input" type="password" id="currentPassword"
                       autocomplete="current-password" required>
                <p class="field__error" id="currentPasswordError"></p>
            </div>

            <div class="field">
                <label class="field__label" for="newPassword">New password</label>
                <input class="field__input" type="password" id="newPassword"
                       autocomplete="new-password" minlength="8" required>
                <p class="field__hint">Minimum 8 characters.</p>
                <p class="field__error" id="newPasswordError"></p>
            </div>

            <div class="field">
                <label class="field__label" for="confirmPassword">Confirm new password</label>
                <input class="field__input" type="password" id="confirmPassword"
                       autocomplete="new-password" required>
                <p class="field__error" id="confirmPasswordError"></p>
            </div>

            <button class="btn btn--primary btn--block" type="submit" id="changeBtn">Save password</button>
        </form>

        <a class="auth__back" href="dashboard.html">Skip for now</a>
    </div>
</main>
</body>
</html>

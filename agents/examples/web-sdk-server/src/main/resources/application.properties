# Web SDK Server Configuration

# Server Configuration
server.port=8084
server.servlet.context-path=/

# Application Name
spring.application.name=web-sdk-server

# Messaging Service Configuration
sdk.messaging-service-url=${MESSAGING_API_URL:http://localhost:8080}
sdk.api-key=${DEFAULT_API_KEY:}

# Temporary Key Configuration
sdk.default-temp-key-ttl=3600

# CORS Configuration
# Left open by default: the demos are opened from a range of hosts (the public
# site, the gateway, local builds, shared LAN addresses) and an allowlist here
# breaks them with "Invalid CORS request". Abuse of /app/api/config is bounded
# instead by the TTL clamp and rate limit in BaseApiConfigController.
# Set SDK_CORS_ALLOWED_ORIGINS to a comma-separated allowlist to lock it down
# for a specific deployment.
sdk.cors-enabled=true
sdk.cors-allowed-origins=${SDK_CORS_ALLOWED_ORIGINS:*}

# Response compression — the CSS and JS bundles are ~90 KB uncompressed.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/markdown,text/xml,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Serve a branded error page for browsers instead of Spring's JSON body.
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

# Logging
logging.level.root=INFO
logging.level.com.hmdev.messaging.minigames=DEBUG

# Actuator
# health only, and without details: the previous show-details=always returned
# host disk totals and component internals to anyone who asked.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.discovery.enabled=false


# Short session codes (see SessionCodeController).
#
# In memory by default: right for a single instance, and a restart forgetting
# every code is safe because a forgotten code fails closed. Set
# SESSION_CODE_REDIS=true where more than one instance runs, or where a restart
# in the middle of somebody's support call should not lose the code they were
# about to read out.
session-code.redis-enabled=${SESSION_CODE_REDIS:false}
# Boot 2.7 reads spring.redis.*; spring.data.redis.* is the Boot 3 spelling and
# is set too so this keeps working when the platform moves up. Getting this
# wrong is silent: the template still exists, pointed at localhost, and every
# operation quietly falls back to memory.
spring.redis.host=${REDIS_HOST:redis}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=2s
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# Redis is optional here, so its state must not decide whether this service is
# healthy: the site works without it and only short codes are affected.
management.health.redis.enabled=false

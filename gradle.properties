# Single source of truth for versions across the SDK.
#
# These had drifted apart: the Java agent published 1.0.0-SNAPSHOT while every
# other module said 1.0.0, and two Spring Boot applications sat on different
# patch releases (2.7.14 and 2.7.18). A consumer reading one module's
# coordinates could not tell what the others were. Change a version here, not
# in a module.
sdkVersion=1.0.0
springBootVersion=2.7.18
springDependencyManagementVersion=1.1.6
